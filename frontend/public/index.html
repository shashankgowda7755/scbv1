        <script>
        // Existing DataCloneError swallow.
        window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);
        // React reconciliation guard against browser extensions (Google Translate,
        // Grammarly, autofill helpers) that mutate the DOM and leave React unable
        // to find children. We wrap the two native methods React calls during
        // reconciliation so a NotFoundError no longer takes down the whole tree.
        (function(){
          try {
            var origInsertBefore = Node.prototype.insertBefore;
            Node.prototype.insertBefore = function(newNode, refNode){
              try { return origInsertBefore.call(this, newNode, refNode); }
              catch(err){
                if (err && err.name === "NotFoundError") { return origInsertBefore.call(this, newNode, null); }
                throw err;
              }
            };
            var origRemoveChild = Node.prototype.removeChild;
            Node.prototype.removeChild = function(child){
              try { return origRemoveChild.call(this, child); }
              catch(err){
                if (err && err.name === "NotFoundError" && child && child.parentNode) { return child.parentNode.removeChild(child); }
                if (err && err.name === "NotFoundError") { return child; }
                throw err;
              }
            };
          } catch(e) { /* ignore — best-effort patch */ }
        })();
        </script>
